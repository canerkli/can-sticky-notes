async function deleteNote(id,button){const note=find(id);if(!note||!currentUser)return;button.disabled=true;closePalette(false);try{const {error}=await client.from(TABLE).delete().eq('id',note.id).eq('user_id',currentUser.id);if(error)throw error;removeLocal(id);friendly(status,'Live sync');}catch(error){button.disabled=false;friendly(status,'Couldn’t delete note · try again','error');}}
async function changeColor(key){const note=find(activeId);if(!note||!currentUser)return;const previous=note.color;note.color=key;colorize(noteEl(note.id),note);closePalette();try{const {error}=await client.from(TABLE).update({color:key}).eq('id',note.id).eq('user_id',currentUser.id);if(error)throw error;friendly(status,dirty.size?'Saving…':'Live sync');}catch(error){note.color=previous;colorize(noteEl(note.id),note);friendly(status,'Couldn’t change color','error');}}
function updateLayout(){const n=Math.max(1,notes.length),style=getComputedStyle(board),w=board.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight),h=board.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom),gap=w<420?14:22,cols=w<480?1:w<720?2:w<900?3:4,rows=Math.ceil(n/cols),size=Math.min(260,(w-(cols-1)*gap)/cols,(h-(rows-1)*gap)/rows);board.style.setProperty('--cols',cols);board.style.setProperty('--size',Math.max(1,Math.floor(size))+'px');board.style.setProperty('--gap',gap+'px');board.style.setProperty('--pad',Math.max(7,Math.min(22,size*.085))+'px');board.style.setProperty('--font',Math.max(12,Math.min(21,size*.083))+'px');empty.hidden=!ready||notes.length!==0;add.disabled=!ready||adding||notes.length>=MAX;updateCount();}
function updateCount(){count.textContent=notes.length>=MAX?`Board full · ${MAX} / ${MAX}`:`${notes.length} / ${MAX} notes`;}
function placePalette(){if(!trigger||palette.hidden)return;const r=trigger.getBoundingClientRect();palette.style.left=Math.max(6,Math.min(innerWidth-200,r.right-194))+'px';palette.style.top=Math.max(6,Math.min(innerHeight-palette.offsetHeight-6,r.bottom+6))+'px';}
function openPalette(id,button){if(activeId===idKey(id)){closePalette();return;}closePalette(false);activeId=idKey(id);trigger=button;button.setAttribute('aria-expanded','true');palette.hidden=false;const n=find(id);[...swatches.children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===n.color)));placePalette();swatches.querySelector('[aria-pressed="true"]')?.focus();}
function closePalette(restore=true){palette.hidden=true;trigger?.setAttribute('aria-expanded','false');if(restore)trigger?.focus();activeId=null;trigger=null;}
Object.entries(colors).forEach(([key,[label,value]])=>{const b=document.createElement('button');b.type='button';b.className='swatch';b.dataset.color=key;b.style.setProperty('--paper',value);b.setAttribute('aria-label',label);b.title=label;b.onclick=()=>changeColor(key);swatches.append(b);});
document.addEventListener('pointerdown',e=>{if(!palette.hidden&&!palette.contains(e.target)&&!trigger?.contains(e.target))closePalette(false);});document.addEventListener('keydown',e=>{if(palette.hidden)return;if(e.key==='Escape'){e.preventDefault();closePalette();}if(['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const buttons=[...swatches.children],i=buttons.indexOf(document.activeElement),d={ArrowRight:1,ArrowLeft:-1,ArrowDown:4,ArrowUp:-4}[e.key];buttons[(i+d+8)%8].focus();}if(e.key==='Tab'){const buttons=[...swatches.children],i=buttons.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();buttons.at(-1).focus();}else if(!e.shiftKey&&i===7){e.preventDefault();buttons[0].focus();}}});
async function reconcile(){if(!ready||!currentUser||!notice.hidden)return;if(dirty.size||board.contains(document.activeElement)){clearTimeout(reconcileTimer);reconcileTimer=setTimeout(reconcile,1000);return;}try{await loadNotes(authEpoch);}catch(error){friendly(status,'Couldn’t refresh sync','error');}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){clearTimeout(reconcileTimer);reconcileTimer=setTimeout(reconcile,250);}});window.addEventListener('focus',()=>{clearTimeout(reconcileTimer);reconcileTimer=setTimeout(reconcile,250);});window.addEventListener('pagehide',()=>{flushAll();});new ResizeObserver(()=>{updateLayout();placePalette();}).observe(board);window.addEventListener('resize',placePalette);loginForm.addEventListener('submit',login);logout.addEventListener('click',signOut);add.addEventListener('click',addNote);retry.addEventListener('click',()=>enterSession({user:currentUser}));
try{if(!window.supabase?.createClient)throw Error('Supabase unavailable');client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});client.auth.onAuthStateChange((event,session)=>setTimeout(()=>{if(event==='SIGNED_OUT'||!session)showSignedOut();else enterSession(session);},0));client.auth.getSession().then(({data,error})=>{if(error)throw error;return enterSession(data.session);}).catch(()=>showSignedOut('Connection unavailable. Try again shortly.'));}catch(error){showSignedOut('Connection unavailable. Try again shortly.');}
})();
